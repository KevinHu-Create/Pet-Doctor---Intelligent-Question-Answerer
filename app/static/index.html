<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pet Doctor Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body class="auth-page">
    <main class="auth-layout">
      <section class="auth-hero">
        <p class="eyebrow">Pet Doctor</p>
        <h1>Your pocket dog health expert</h1>
        <div class="hero-badges">
          <span class="pill">FastAPI</span>
          <span class="pill">Milvus Retrieval</span>
          <span class="pill">Ollama Answers</span>
        </div>
      </section>

      <section class="auth-card">
        <div class="auth-tabs">
          <button type="button" class="tab-button is-active" data-auth-tab="login">
            Login
          </button>
          <button type="button" class="tab-button" data-auth-tab="register">
            Register
          </button>
          <button type="button" class="tab-button" data-auth-tab="admin">
            Admin Login
          </button>
        </div>

        <p id="auth-status" class="inline-status" data-tone="neutral">
          Use an existing account or create a new one to enter the service.
        </p>

        <form id="login-form" class="auth-form">
          <label>
            Username
            <input name="username" placeholder="Username" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              placeholder="Password"
              required
            />
          </label>
          <button type="submit" id="login-submit">Enter Workspace</button>
        </form>

        <form id="register-form" class="auth-form is-hidden">
          <label>
            Username
            <input name="username" placeholder="Choose a username" required />
          </label>
          <label>
            Email
            <input name="email" type="email" placeholder="Email" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              placeholder="Create a password"
              required
            />
          </label>
          <label>
            Pet Name
            <input name="pet_name" placeholder="Optional pet name" />
          </label>
          <label>
            Pet Type
            <input name="pet_type" placeholder="Optional pet type" />
          </label>
          <button type="submit" id="register-submit">Create Account</button>
        </form>

        <form id="admin-form" class="auth-form is-hidden">
          <label>
            Admin Username
            <input name="username" placeholder="Admin username" required />
          </label>
          <label>
            Password
            <input
              name="password"
              type="password"
              placeholder="Admin password"
              required
            />
          </label>
          <p class="muted-copy">
            Administrator accounts are provisioned from the built-in admin database,
            not from the public registration page.
          </p>
          <button type="submit" id="admin-submit">Enter Admin Console</button>
        </form>
      </section>
    </main>

    <script type="module" src="/static/auth.js"></script>
  </body>
</html>
